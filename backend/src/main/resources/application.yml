spring:
  application:
    name: crypto-portfolio-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crypto_portfolio_hub}
    username: ${SPRING_DATASOURCE_USERNAME:crypto_portfolio_hub}
    password: ${SPRING_DATASOURCE_PASSWORD:crypto_portfolio_hub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  security:
    credential-encryption:
      key-base64: ${CREDENTIAL_ENCRYPTION_KEY_BASE64:}
      current-key-version: ${CREDENTIAL_ENCRYPTION_KEY_VERSION:1}
  auth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  market-data:
    coin-gecko-demo-api-key: ${COINGECKO_DEMO_API_KEY:}
    exchange-rate-api-key: ${EXCHANGERATE_API_KEY:}
    connect-timeout: ${MARKET_DATA_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${MARKET_DATA_READ_TIMEOUT:PT5S}
    price-cache-ttl: ${MARKET_DATA_PRICE_CACHE_TTL:PT10M}
    price-freshness: ${MARKET_DATA_PRICE_FRESHNESS:PT15M}
    fx-freshness: ${MARKET_DATA_FX_FRESHNESS:PT72H}
    fx-maximum-request-interval: ${MARKET_DATA_FX_REQUEST_INTERVAL:PT24H}
  solana:
    rpc-url: ${SOLANA_RPC_URL:https://api.mainnet-beta.solana.com}
    helius-api-key: ${HELIUS_API_KEY:}
    connect-timeout: ${SOLANA_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${SOLANA_READ_TIMEOUT:PT5S}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
